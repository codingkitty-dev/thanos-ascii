<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thanos 3D ASCII Sonsuzluk Eldiveni</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #04060b;
      user-select: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="screen" role="img"
    aria-label="Siyah arka plan üzerinde 3 boyutlu dönen altın Thanos Sonsuzluk Eldiveni, parmak şıklatma, parlama ve toz efekti">
  </canvas>

  <script type="module">
    const canvas = document.querySelector('#screen');
    const ctx = canvas.getContext('2d');
    const motion = matchMedia('(prefers-reduced-motion: reduce)');
    const tau = Math.PI * 2;

    // Altin zirh renk paletleri (koyudan parlak metale)
    const gold = ['#5c3c0c', '#966617', '#cc9424', '#f4c64f', '#fff1b3'];
    const goldDark = ['#3b2406', '#66430d', '#966618', '#c48d26', '#e8ba54'];
    const goldGroove = ['#211303', '#362006', '#4d2f0a', '#694210', '#875718'];
    const goldRim = ['#b58120', '#e3ad36', '#ffd96e', '#fff3b5', '#ffffff'];
    const letters = 'x+oOX*#';
    const starColors = ['#263142', '#4a5d78', '#7d92b0', '#c8d7eb'];

    // 6 Sonsuzluk Tasi (el ustunde / dis yuzde)
    const stones = [
      { id: 'P', x: -12.6, y: 49.4, z: 7.4,  rx: 2.7, ry: 2.4, rz: 2.4, core: '#f8d0ff', body: '#bd42ff', delay: 3.6 },
      { id: 'S', x: -4.4,  y: 50.8, z: 8.3,  rx: 2.9, ry: 2.6, rz: 2.5, core: '#cceaff', body: '#2a94ff', delay: 4.05 },
      { id: 'R', x: 4.1,   y: 51.0, z: 8.3,  rx: 2.9, ry: 2.6, rz: 2.5, core: '#ffccd2', body: '#ff2b42', delay: 4.5 },
      { id: 'O', x: 12.2,  y: 49.6, z: 7.4,  rx: 2.7, ry: 2.4, rz: 2.4, core: '#ffe5bf', body: '#ff8c1a', delay: 4.95 },
      { id: 'T', x: 17.4,  y: 35.0, z: 6.4,  rx: 2.9, ry: 2.9, rz: 2.6, core: '#ccffe0', body: '#27eb6c', delay: 5.4 },
      { id: 'M', x: 0.0,   y: 39.2, z: 9.6,  rx: 4.3, ry: 3.9, rz: 3.0, core: '#fffcc7', body: '#ffdd24', delay: 5.85 }
    ];

    const gauntletHeight = 84;
    let width, height, unit, columnWidth, rowHeight, columns, rows, baseY;
    let depth, marks, colors;
    let turnCos = 1;
    let turnSin = 0;
    let seed = 481516;
    let start = performance.now();
    let lastFrame = -Infinity;

    function random() {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      return seed / 4294967296;
    }

    function clamp01(v) {
      return Math.max(0, Math.min(1, v));
    }

    function ease(value) {
      const t = clamp01(value);
      return t * t * (3 - 2 * t);
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function norm(x, y, z) {
      const m = Math.hypot(x, y, z) || 1;
      return [x / m, y / m, z / m];
    }

    // 1. Eldivenin sabit 3D alt govdesi (genis zirhli kolluk -> dar bilek -> el ustu)
    const staticGauntlet = [];

    // Kolluk / on kol zirhi (y: 0 -> 26)
    for (let s = 0; s <= 44; s++) {
      const t = s / 44;
      const y = t * 26;
      const flare = (1 - t) * (1 - t) * 3.8;
      const rx = 10.4 + (1 - t) * 2.8 + flare;
      const rz = rx * 0.78;
      const isRim = (t < 0.08) || (Math.abs(t - 0.52) < 0.04) || (t > 0.92);
      const isGroove = (Math.abs(t - 0.11) < 0.025) || (Math.abs(t - 0.57) < 0.025) || (Math.abs(t - 0.88) < 0.025);
      const pal = isRim ? goldRim : (isGroove ? goldGroove : goldDark);
      const bump = isRim ? 0.85 : (isGroove ? -0.45 : 0);

      const rings = 84;
      for (let k = 0; k < rings; k++) {
        const ang = ((k + random() * 0.3) / rings) * tau;
        const ca = Math.cos(ang);
        const sa = Math.sin(ang);
        const flute = Math.cos(ang * 6) > 0.82 ? 0.45 : 0;
        const x = ca * (rx + bump + flute);
        const z = sa * (rz + bump + flute);
        const [nx, ny, nz] = norm(ca / rx, isRim ? 0.15 : 0.08, sa / rz);

        staticGauntlet.push({
          x, y, z, nx, ny, nz,
          shade: random(),
          mark: isRim ? '*' : (isGroove ? '-' : letters[Math.floor(random() * letters.length)]),
          palette: pal
        });
      }
    }

    // El ustu ve avuc ici (y: 26 -> 51)
    for (let s = 0; s <= 44; s++) {
      const t = s / 44;
      const y = 26 + t * 25.2;
      const widthCurve = Math.sin(t * Math.PI * 0.62);
      const rx = 10.5 + widthCurve * 6.0;
      const rz = 7.4 + Math.sin(t * Math.PI) * 1.6;
      const isKnuckle = t > 0.86;
      const pal = isKnuckle ? goldRim : gold;

      const rings = 88;
      for (let k = 0; k < rings; k++) {
        const ang = ((k + random() * 0.3) / rings) * tau;
        const ca = Math.cos(ang);
        const sa = Math.sin(ang);
        const sx = Math.sign(ca) * (Math.abs(ca) ** 0.82);
        const sz = Math.sign(sa) * (Math.abs(sa) ** 0.88);
        const plateBoost = (sa > 0.35 && t > 0.2 && t < 0.82 && Math.abs(ca) < 0.72) ? 0.65 : 0;
        const x = sx * rx;
        const z = sz * (rz + plateBoost);
        const [nx, ny, nz] = norm(sx / rx, isKnuckle ? 0.35 : 0.0, sz / rz);

        staticGauntlet.push({
          x, y, z, nx, ny, nz,
          shade: random(),
          mark: isKnuckle ? '*' : letters[Math.floor(random() * letters.length)],
          palette: pal
        });
      }
    }

    // Basparmak koku kasli zirh yastigi
    for (let iv = 1; iv < 22; iv++) {
      const v = (iv / 22) * Math.PI - Math.PI / 2;
      const cv = Math.cos(v), sv = Math.sin(v);
      const count = Math.max(10, Math.round(34 * Math.max(0.3, cv)));
      for (let iu = 0; iu < count; iu++) {
        const u = ((iu + random() * 0.35) / count) * tau;
        const cu = Math.cos(u), su = Math.sin(u);
        const x = 13.8 + 5.6 * cv * cu;
        const y = 34.5 + 7.2 * sv;
        const z = 2.6 + 5.2 * cv * su;
        const [nx, ny, nz] = norm(cv * cu, sv, cv * su);
        staticGauntlet.push({
          x, y, z, nx, ny, nz,
          shade: random(),
          mark: letters[Math.floor(random() * letters.length)],
          palette: gold
        });
      }
    }

    // Tas yuvalari
    for (const st of stones) {
      for (let k = 0; k < 28; k++) {
        const ang = (k / 28) * tau;
        const ca = Math.cos(ang), sa = Math.sin(ang);
        staticGauntlet.push({
          x: st.x + ca * (st.rx + 0.8),
          y: st.y + sa * (st.ry + 0.8),
          z: st.z - 0.5,
          nx: ca * 0.6, ny: sa * 0.6, nz: 0.75,
          shade: 0.9,
          mark: '+',
          palette: goldRim
        });
      }
    }

    staticGauntlet.sort((a, b) => a.y - b.y);

    // 2. Gercekci 3 bogumlu 3D parmak iskeleti
    function computeFingerSkeleton(pinchT, snapT) {
      const defs = [
        [-12.8, 50.0, 0.2, 7.6, 5.8, 4.6, 2.8, 0.22, 1.38, 1.56, -0.20, -0.12, -0.12],
        [ -4.5, 51.6, 0.7, 9.2, 7.0, 5.4, 3.1, 0.16, 1.28, 1.50, -0.07, -0.04, -0.05],
        [  4.1, 52.0, 0.7, 10.2, 7.6, 5.8, 3.2, 0.12, 0.86, 1.65,  0.03,  0.34,  0.10],
        [ 12.2, 50.6, 0.2, 9.0, 6.8, 5.2, 3.1, 0.16, 0.22, 0.10,  0.15,  0.20,  0.22]
      ];

      const segments = [];
      for (const d of defs) {
        const [bx, by, bz, l1, l2, l3, r, cO, cP, cS, sO, sP, sS] = d;
        const curl = snapT > 0 ? lerp(cP, cS, snapT) : lerp(cO, cP, pinchT);
        const splay = snapT > 0 ? lerp(sP, sS, snapT) : lerp(sO, sP, pinchT);

        const p0 = [bx, by, bz];
        // Parmaklar avuc icine (-z), yani taslarin oldugu el ustunun (+z) tersine bukulur
        const p1 = [
          bx + Math.sin(splay) * l1,
          by + Math.cos(curl * 0.55) * l1,
          bz - Math.sin(curl * 0.55) * l1
        ];
        const p2 = [
          p1[0] + Math.sin(splay) * l2 * 0.7,
          p1[1] + Math.cos(curl * 1.15) * l2,
          p1[2] - Math.sin(curl * 1.15) * l2
        ];
        const p3 = [
          p2[0] + Math.sin(splay) * l3 * 0.5,
          p2[1] + Math.cos(curl * 1.72) * l3,
          p2[2] - Math.sin(curl * 1.72) * l3
        ];
        segments.push([p0, p1, r, r * 0.90, gold]);
        segments.push([p1, p2, r * 0.88, r * 0.78, goldDark]);
        segments.push([p2, p3, r * 0.76, r * 0.58, goldRim]);
      }

      // Basparmak (avuc icine -z yonunde orta parmakla bulusur)
      const tOpen  = [[16.4, 34.5, -1.6], [23.8, 42.2, -4.8], [27.4, 51.4, -7.2]];
      const tPinch = [[16.4, 34.5, -1.6], [20.6, 43.4, -8.8], [14.0, 52.8, -14.8]];
      const tSnap  = [[16.4, 34.5, -1.6], [24.6, 44.8, -5.8], [29.8, 56.8, -7.0]];

      const tPts = [0, 1, 2].map(i => [
        snapT > 0 ? lerp(tPinch[i][0], tSnap[i][0], snapT) : lerp(tOpen[i][0], tPinch[i][0], pinchT),
        snapT > 0 ? lerp(tPinch[i][1], tSnap[i][1], snapT) : lerp(tOpen[i][1], tPinch[i][1], pinchT),
        snapT > 0 ? lerp(tPinch[i][2], tSnap[i][2], snapT) : lerp(tOpen[i][2], tPinch[i][2], pinchT)
      ]);
      segments.push([tPts[0], tPts[1], 3.9, 3.4, gold]);
      segments.push([tPts[1], tPts[2], 3.3, 2.4, goldRim]);

      return { segments, snapPoint: tPts[2] };
    }

    // Arka plan yildizlari
    const stars = Array.from({ length: 240 }, () => ({
      x: random(),
      y: random(),
      speed: 0.004 + random() * 0.015,
      phase: random() * tau,
      shade: Math.floor(random() * starColors.length)
    }));

    // Siklatma sonrasi 3D toz parcaciklari
    const dustPalette = [
      '#ffefad', '#f2c14e', '#d9a432', '#bd42ff', '#2a94ff',
      '#ff2b42', '#ff8c1a', '#27eb6c', '#c8c2b8', '#8c867e', '#4d4a46'
    ];
    const dustParticles = Array.from({ length: 460 }, (_, i) => {
      const fromAura = i < 210;
      const ang = random() * tau;
      const rad = fromAura ? (10 + random() * 24) : (18 + random() * 34);
      return {
        x0: fromAura ? Math.cos(ang) * rad + 8 : 16 + random() * 32,
        y0: fromAura ? 18 + random() * 54 : 10 + random() * 64,
        z0: Math.sin(ang) * rad,
        vx: 7.5 + random() * 17.0,
        vy: -3.0 + random() * 11.5,
        vz: -7.0 + random() * 14.0,
        delay: random() * 1.15,
        life: 2.2 + random() * 3.5,
        phase: random() * tau,
        colorIdx: Math.floor(random() * (dustPalette.length - 3))
      };
    });

    function resize() {
      width = Math.max(1, canvas.clientWidth);
      height = Math.max(1, canvas.clientHeight);
      const ratio = Math.min(devicePixelRatio || 1, 2);

      canvas.width = Math.round(width * ratio);
      canvas.height = Math.round(height * ratio);
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

      unit = Math.min(width / 106, height / 114);
      baseY = (height + unit * 74) / 2;
      const font = Math.max(2, Math.min(unit * 0.94, 13));

      ctx.font = `bold ${font}px monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      columnWidth = Math.max(ctx.measureText('M').width, font * 0.66);
      rowHeight = font * 1.05;
      columns = Math.ceil(width / columnWidth);
      rows = Math.ceil(height / rowHeight);

      depth = new Float32Array(columns * rows);
      marks = new Array(columns * rows);
      colors = new Array(columns * rows);
      lastFrame = -Infinity;
    }

    function put(x, y, z, mark, color) {
      const col = Math.floor(x / columnWidth);
      const row = Math.floor(y / rowHeight);
      if (col < 0 || row < 0 || col >= columns || row >= rows) return;

      const index = row * columns + col;
      if (z < depth[index]) return;

      depth[index] = z;
      marks[index] = mark;
      colors[index] = color;
    }

    function project(x, y, z, mark, color) {
      const side = x * turnCos - z * turnSin;
      const front = x * turnSin + z * turnCos;
      const scale = 1 + front * 0.0048;

      put(
        width / 2 + side * scale * unit,
        baseY - (y * scale - front * 0.22) * unit,
        front,
        mark,
        color
      );
    }

    function drawStars(time) {
      for (const s of stars) {
        const twinkle = Math.sin(time * 2.4 + s.phase) > 0.45;
        const x = ((s.x + time * s.speed) % 1) * width;
        const y = s.y * height;
        put(x, y, -120, twinkle && s.shade >= 2 ? '+' : '.', starColors[s.shade]);
      }
    }

    function drawPedestal() {
      for (let z = -34; z <= 36; z += 3) {
        for (let x = -38; x <= 38; x += 2.2) {
          if ((x / 38) ** 2 + (z / 36) ** 2 > 1) continue;
          if (Math.sin(x * 7.5 + z * 4.8) < -0.25) continue;
          put(width / 2 + x * unit, baseY + (1.5 + z * 0.22) * unit, z - 20, '.', '#2b2416');
        }
      }
    }

    function shadePoint(pt, flashBoost) {
      const nx = pt.nx * turnCos - pt.nz * turnSin;
      const nz = pt.nx * turnSin + pt.nz * turnCos;
      const ny = pt.ny;

      const l1 = Math.max(0, nx * 0.50 + ny * 0.48 + nz * 0.72);
      const l2 = Math.max(0, nx * -0.62 + ny * 0.32 + nz * 0.32) * 0.35;
      const light = clamp01(0.14 + l1 * 0.74 + l2 + pt.shade * 0.14 + flashBoost * 0.55);

      const idx = Math.min(pt.palette.length - 1, Math.floor(light * pt.palette.length));
      return {
        color: flashBoost > 0.65 ? '#fff8d6' : pt.palette[idx],
        mark: light > 0.86 ? '*' : pt.mark
      };
    }

    function drawStaticGauntlet(grownY, flashBoost) {
      for (const pt of staticGauntlet) {
        if (pt.y > grownY) break;
        const edge = grownY < gauntletHeight && grownY - pt.y < 2.2;
        if (edge) {
          project(pt.x, pt.y, pt.z, '*', '#fff3c4');
        } else {
          const s = shadePoint(pt, flashBoost);
          project(pt.x, pt.y, pt.z, s.mark, s.color);
        }
      }
    }

    function drawFingers(grownY, pinchT, snapT, flashBoost) {
      const { segments, snapPoint } = computeFingerSkeleton(pinchT, snapT);

      for (const [p0, p1, r0, r1, palette] of segments) {
        const dx = p1[0] - p0[0];
        const dy = p1[1] - p0[1];
        const dz = p1[2] - p0[2];
        const len = Math.hypot(dx, dy, dz) || 1;
        const ax = dx / len, ay = dy / len, az = dz / len;

        const ref = Math.abs(ay) < 0.9 ? [0, 1, 0] : [1, 0, 0];
        const [ux, uy, uz] = norm(
          ay * ref[2] - az * ref[1],
          az * ref[0] - ax * ref[2],
          ax * ref[1] - ay * ref[0]
        );
        const vx = ay * uz - az * uy;
        const vy = az * ux - ax * uz;
        const vz = ax * uy - ay * ux;

        const segs = 12;
        const rings = 24;
        for (let s = 0; s <= segs; s++) {
          const t = s / segs;
          const cx = p0[0] + dx * t;
          const cy = p0[1] + dy * t;
          const cz = p0[2] + dz * t;
          if (cy > grownY) continue;
          const r = lerp(r0, r1, t);
          const edge = grownY < gauntletHeight && grownY - cy < 2.2;
          const jointBand = s === 0 || s === segs;

          for (let k = 0; k < rings; k++) {
            const ang = (k / rings) * tau;
            const ca = Math.cos(ang);
            const sa = Math.sin(ang);
            const nx = ux * ca + vx * sa;
            const ny = uy * ca + vy * sa;
            const nz = uz * ca + vz * sa;
            const px = cx + nx * (r + (jointBand ? 0.25 : 0));
            const py = cy + ny * (r + (jointBand ? 0.25 : 0));
            const pz = cz + nz * (r + (jointBand ? 0.25 : 0));

            if (edge) {
              project(px, py, pz, '*', '#fff3c4');
            } else {
              const shaded = shadePoint({
                nx, ny, nz,
                shade: ((s * 7 + k * 13) % 10) / 10,
                mark: jointBand ? '+' : letters[(s + k) % letters.length],
                palette: jointBand ? goldRim : palette
              }, flashBoost);
              project(px, py, pz, shaded.mark, shaded.color);
            }
          }
        }
      }

      return snapPoint;
    }

    function drawStones(time, flashBoost) {
      for (const stone of stones) {
        const scale = ease((time - stone.delay) / 0.55);
        if (scale <= 0.05) continue;

        const pulse = 1 + 0.08 * Math.sin(time * 5.2 + stone.delay * 3);
        const rx = stone.rx * scale * pulse;
        const ry = stone.ry * scale * pulse;
        const rz = stone.rz * scale * pulse;

        for (let dy = -ry; dy <= ry; dy += 0.42) {
          for (let dx = -rx; dx <= rx; dx += 0.42) {
            const sq = 1 - (dx / rx) ** 2 - (dy / ry) ** 2;
            if (sq < 0) continue;
            const dz = Math.sqrt(sq) * rz;
            const shiny = dx < 0.3 && dy > -0.2 && sq > 0.38;
            const color = (shiny || flashBoost > 0.5) ? stone.core : stone.body;
            const mark = shiny ? '*' : 'O';
            project(stone.x + dx, stone.y + dy, stone.z + dz, mark, color);
          }
        }
      }
    }

    function drawChargeSparks(time, snapPoint) {
      const intensity = ease((time - 6.7) / 0.7) * (1 - ease((time - 8.55) / 0.15));
      if (intensity <= 0.02) return;

      for (let i = 0; i < 52; i++) {
        const ang = time * 4.6 + i * 0.85;
        const r = (1 - intensity * 0.65) * (6 + (i % 7) * 2.2);
        const sx = snapPoint[0] + Math.cos(ang) * r;
        const sy = snapPoint[1] + Math.sin(ang * 1.3) * r * 0.7;
        const sz = snapPoint[2] + Math.sin(ang) * r;
        const col = i % 3 === 0 ? '#ffffff' : (i % 2 === 0 ? '#ffefad' : '#f2c14e');
        project(sx, sy, sz, i % 2 === 0 ? '*' : '+', col);
      }
    }

    function drawShockwave(time, snapPoint) {
      const age = time - 8.65;
      if (age <= 0 || age > 1.45) return;

      const progress = age / 1.45;
      const radius = 3 + ease(progress) * 58;
      const fade = 1 - progress;
      const steps = 110;

      for (let i = 0; i < steps; i++) {
        const ang = (i / steps) * tau;
        for (const ringOffset of [-1.2, 0, 1.2]) {
          const r = radius + ringOffset;
          const x = snapPoint[0] + Math.cos(ang) * r;
          const y = snapPoint[1] + Math.sin(ang) * r;
          const z = snapPoint[2] + Math.sin(ang * 2) * 8;
          const col = fade > 0.55 ? '#ffffff' : (fade > 0.25 ? '#ffec99' : '#c89226');
          const mark = fade > 0.5 ? '*' : (fade > 0.22 ? '+' : '.');
          project(x, y, z, mark, col);
        }
      }
    }

    function drawDust(time) {
      const snapAge = time - 9.1;
      if (snapAge <= 0) return;

      for (const p of dustParticles) {
        const age = snapAge - p.delay;
        if (age <= 0 || age >= p.life) continue;

        const prog = age / p.life;
        const drift = age;
        const x = p.x0 + p.vx * drift + 0.5 * 3.8 * drift * drift;
        const y = p.y0 + p.vy * drift + Math.sin(age * 4.5 + p.phase) * 2.2;
        const z = p.z0 + p.vz * drift;

        let mark, color;
        if (prog < 0.25) {
          mark = '*';
          color = dustPalette[p.colorIdx];
        } else if (prog < 0.55) {
          mark = '+';
          color = dustPalette[Math.min(dustPalette.length - 2, p.colorIdx + 2)];
        } else if (prog < 0.8) {
          mark = ':';
          color = '#8a8278';
        } else {
          mark = '.';
          color = '#423e3a';
        }

        project(x, y, z, mark, color);
      }
    }

    function render(time) {
      depth.fill(-Infinity);
      marks.fill('');

      const loopTime = time % 17.5;

      let rotation;
      if (loopTime < 6.4) {
        // Ilk kisimda elin dis yuzu (+z) ve 6 tas kameraya bakar
        rotation = Math.sin(loopTime * 0.72) * 0.48;
      } else if (loopTime < 9.9) {
        // Siklatma icin el gercek filmdeki gibi donup avuc icini ve basparmaktaki Zaman Tasini gosterir
        const turnT = ease((loopTime - 6.4) / 1.25);
        rotation = lerp(Math.sin(6.4 * 0.72) * 0.48, 2.58, turnT);
      } else if (loopTime < 12.2) {
        // Siklatma sonrasi toz bulutu yayilirken tekrar el ustu taslarina doner
        const backT = ease((loopTime - 9.9) / 2.3);
        rotation = lerp(2.58, 0.25, backT);
      } else {
        rotation = 0.25 + Math.sin((loopTime - 12.2) * 0.6) * 0.52;
      }

      turnCos = Math.cos(rotation);
      turnSin = Math.sin(rotation);

      const grownY = gauntletHeight * ease((loopTime - 0.35) / 3.5);
      const pinchT = ease((loopTime - 6.8) / 1.45);
      const snapT = ease((loopTime - 8.55) / 0.22);

      let flashBoost = 0;
      if (loopTime >= 8.58 && loopTime < 9.85) {
        const fa = loopTime - 8.58;
        flashBoost = fa < 0.14 ? fa / 0.14 : Math.max(0, 1 - (fa - 0.14) / 1.1);
      }

      drawStars(loopTime);
      drawPedestal();
      drawStaticGauntlet(grownY, flashBoost);
      const snapPoint = drawFingers(grownY, pinchT, snapT, flashBoost);
      drawStones(loopTime, flashBoost);
      drawChargeSparks(loopTime, snapPoint);
      drawShockwave(loopTime, snapPoint);
      drawDust(loopTime);

      if (flashBoost > 0.05) {
        const f2 = flashBoost * flashBoost;
        const r = Math.round(4 + 240 * f2);
        const g = Math.round(6 + 225 * f2);
        const b = Math.round(11 + 175 * f2);
        ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
      } else {
        ctx.fillStyle = '#04060b';
      }
      ctx.fillRect(0, 0, width, height);

      for (let i = 0; i < marks.length; i++) {
        if (!marks[i]) continue;
        ctx.fillStyle = colors[i];
        ctx.fillText(
          marks[i],
          ((i % columns) + 0.5) * columnWidth,
          (Math.floor(i / columns) + 0.5) * rowHeight
        );
      }

      const titleAlpha = ease((loopTime - 9.3) / 0.8) * (1 - ease((loopTime - 16.4) / 0.9));
      if (titleAlpha > 0.01) {
        ctx.globalAlpha = titleAlpha;
        ctx.fillStyle = '#f2c968';
        ctx.fillText(
          'I N F I N I T Y   S N A P',
          width / 2,
          baseY + unit * 14,
          width * 0.9
        );
        ctx.globalAlpha = 1;
      }
    }

    function restart() {
      start = performance.now();
      lastFrame = -Infinity;
    }

    function animate(now) {
      const still = motion.matches;
      if (lastFrame === -Infinity || (!still && now - lastFrame >= 32)) {
        render(still ? 10.5 : Math.max(0, (now - start) / 1000));
        lastFrame = now;
      }
      requestAnimationFrame(animate);
    }

    addEventListener('resize', resize);
    addEventListener('keydown', event => {
      if (event.key.toLowerCase() === 'r') restart();
    });
    canvas.addEventListener('click', restart);
    motion.addEventListener('change', restart);

    resize();
    render(motion.matches ? 10.5 : 0);
    requestAnimationFrame(animate);
  </script>
</body>
</html>
